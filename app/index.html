<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<meta name="theme-color" content="#1a3a2e" />
<meta name="color-scheme" content="dark" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Tello Staff</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Crect width=%27100%27 height=%27100%27 rx=%2722%27 fill=%27%231a3a2e%27/%3E%3Ctext x=%2750%27 y=%2770%27 font-size=%2760%27 font-family=%27Arial,sans-serif%27 font-weight=%27bold%27 fill=%27%23e8c15c%27 text-anchor=%27middle%27%3ET%3C/text%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg-page: #0f2019;
    --bg-app: #1a3a2e;
    --bg-card: #204638;
    --bg-elevated: #2a5644;
    --bg-input: #17332a;
    --border: #3a6b54;
    --text: #eef6f1;
    --text-muted: #a8c6b6;
    --accent: #e8c15c;
    --accent-contrast: #1a3a2e;
    --positive: #6bd39a;
    --danger: #e5726b;
    --danger-bg: rgba(229, 114, 107, 0.15);
    --danger-text: #f3b3ae;
    --radius: 10px;
    --auth-gradient: radial-gradient(circle at 50% 0%, #234a3b, var(--bg-page) 70%);
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg-page: #f2f6f3;
    --bg-app: #ffffff;
    --bg-card: #ffffff;
    --bg-elevated: #eaf2ec;
    --bg-input: #f6faf7;
    --border: #cfe0d4;
    --text: #16281f;
    --text-muted: #5c7568;
    --accent: #c99328;
    --accent-contrast: #ffffff;
    --positive: #2f9d67;
    --danger: #c0392b;
    --danger-bg: rgba(192, 57, 43, 0.10);
    --danger-text: #8f2a1e;
    --auth-gradient: radial-gradient(circle at 50% 0%, #e3efe6, var(--bg-page) 70%);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg-page);
    color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  body { transition: background-color 0.15s ease, color 0.15s ease; }
  button, input { font-family: inherit; }
  h1, h2, h3, h4 { margin: 0 0 8px; font-weight: 700; }
  p { margin: 0 0 8px; color: var(--text-muted); }

  /* ---------- Auth screen ---------- */
  .auth-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: var(--auth-gradient);
  }
  .auth-card {
    width: 100%;
    max-width: 380px;
    background: var(--bg-app);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px 28px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }
  .auth-logo {
    font-size: 28px;
    font-weight: 800;
    text-align: center;
    margin-bottom: 4px;
    letter-spacing: 0.5px;
  }
  .auth-logo span { color: var(--accent); }
  .auth-sub {
    text-align: center;
    font-size: 13px;
    margin-bottom: 24px;
  }
  .auth-tabs {
    display: flex;
    background: var(--bg-input);
    border-radius: 8px;
    padding: 4px;
    margin-bottom: 20px;
  }
  .auth-tab {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--text-muted);
    padding: 8px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 600;
    font-size: 14px;
  }
  .auth-tab.active { background: var(--accent); color: var(--accent-contrast); }
  #authForm { display: flex; flex-direction: column; gap: 12px; }
  .link-btn {
    display: block;
    width: 100%;
    background: none;
    border: none;
    color: var(--text-muted);
    text-decoration: underline;
    font-size: 13px;
    margin-top: 14px;
    cursor: pointer;
    text-align: center;
  }
  .auth-msg {
    margin-top: 14px;
    font-size: 13px;
    text-align: center;
    min-height: 16px;
    color: var(--positive);
  }
  .auth-msg.error { color: var(--danger); }
  .config-warning {
    margin-top: 18px;
    padding: 10px 12px;
    background: var(--danger-bg);
    border: 1px solid var(--danger);
    border-radius: 8px;
    font-size: 12px;
    color: var(--danger-text);
  }
  .auth-footer-links { margin-top: 20px; text-align: center; font-size: 12px; }
  .auth-footer-links a { color: var(--text-muted); text-decoration: none; }
  .auth-footer-links a:hover { color: var(--accent); }

  /* ---------- Inputs / buttons ---------- */
  input[type="text"], input[type="email"], input[type="password"], input[type="time"], input[type="date"] {
    background: var(--bg-input);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 14px;
    width: 100%;
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  input::placeholder { color: #6f9284; }
  textarea.staff-notes {
    background: var(--bg-input);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
    width: 100%;
  }
  textarea.staff-notes:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  textarea.staff-notes::placeholder { color: #6f9284; }

  .btn-primary {
    background: var(--accent);
    color: var(--accent-contrast);
    border: none;
    padding: 10px 16px;
    border-radius: 8px;
    font-weight: 700;
    cursor: pointer;
    font-size: 14px;
    white-space: nowrap;
  }
  .btn-primary.full { width: 100%; }
  .btn-outline {
    background: var(--bg-elevated);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
  }
  .btn-outline.small { padding: 6px 10px; font-size: 12px; }
  .btn-icon {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    color: var(--text);
    width: 36px; height: 36px;
    border-radius: 8px;
    font-size: 18px;
    cursor: pointer;
  }
  .btn-icon.small { width: 32px; height: 32px; font-size: 15px; }
  .header-actions { display: flex; align-items: center; gap: 8px; }
  .btn-remove {
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 14px;
    padding: 4px 8px;
  }
  .btn-remove:hover { color: var(--danger); }

  /* ---------- App shell ---------- */
  .app { min-height: 100vh; display: flex; flex-direction: column; }
  .app-header {
    background: var(--bg-app);
    border-bottom: 1px solid var(--border);
    padding: 14px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 5;
  }
  .app-title { font-size: 18px; font-weight: 800; }
  .app-title span { color: var(--accent); }
  .app-main {
    flex: 1;
    padding: 16px;
    padding-bottom: 90px;
    max-width: 1100px;
    width: 100%;
    margin: 0 auto;
  }
  .view { display: none; }
  .view.active { display: block; }
  .view.placeholder-view.active { display: flex; }

  .bottom-nav {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--bg-app);
    border-top: 1px solid var(--border);
    display: flex;
    padding: 6px 6px calc(6px + env(safe-area-inset-bottom));
    z-index: 10;
  }
  .nav-btn {
    flex: 1;
    background: none;
    border: none;
    color: var(--text-muted);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    padding: 8px 4px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 11px;
    font-weight: 600;
  }
  .nav-btn .nav-icon { font-size: 20px; }
  .nav-btn.active { color: var(--accent); background: rgba(232, 193, 92, 0.1); }

  .placeholder-view { align-items: center; justify-content: center; min-height: 50vh; }
  .placeholder { text-align: center; color: var(--text-muted); max-width: 320px; }
  .placeholder-icon { font-size: 40px; margin-bottom: 12px; }

  /* ---------- Schedule view ---------- */
  .print-only { display: none; }
  .week-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }
  .home-select {
    background: var(--bg-input);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 10px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    max-width: 180px;
  }
  .view-toggle { display: flex; background: var(--bg-input); border-radius: 8px; padding: 3px; }
  .view-toggle button {
    background: transparent;
    border: none;
    color: var(--text-muted);
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
    font-weight: 700;
  }
  .view-toggle button.active { background: var(--accent); color: var(--accent-contrast); }
  .week-label { font-weight: 700; font-size: 15px; flex: 1; text-align: center; min-width: 160px; }
  .assigned-staff-strip {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 14px;
    padding: 10px 12px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  .assigned-staff-label { font-size: 12px; color: var(--text-muted); font-weight: 600; white-space: nowrap; }
  .staff-chip {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 5px 12px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .staff-chip:hover { border-color: var(--accent); color: var(--accent); }
  .section-title { margin-top: 28px; margin-bottom: 12px; font-size: 16px; }

  .manage-panel {
    display: flex;
    gap: 24px;
    flex-wrap: wrap;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 20px;
  }
  .manage-col { flex: 1; min-width: 220px; }
  .manage-col h4 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); }
  .manage-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
  .manage-row { display: flex; align-items: center; gap: 6px; }
  .manage-name-input { flex: 1; }
  .share-row { flex-wrap: wrap; }
  .share-row-name { flex: 1; font-size: 14px; font-weight: 600; min-width: 100px; }

  .grid-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius); }
  table.schedule-grid {
    border-collapse: collapse;
    width: 100%;
    min-width: 760px;
  }
  .schedule-grid th, .schedule-grid td {
    border: 1px solid var(--border);
    padding: 6px 8px;
    text-align: left;
    font-size: 13px;
  }
  .schedule-grid thead th {
    background: var(--bg-elevated);
    font-size: 12px;
    text-align: center;
    white-space: nowrap;
  }
  .schedule-grid thead th.is-today { color: var(--accent); }
  .day-date { font-weight: 400; color: var(--text-muted); font-size: 11px; }
  .schedule-grid th.row-head {
    background: var(--bg-card);
    font-weight: 700;
    white-space: nowrap;
    vertical-align: middle;
  }
  .schedule-grid td.slot-label {
    background: var(--bg-card);
    color: var(--text-muted);
    white-space: nowrap;
    font-size: 12px;
  }
  .schedule-grid td { background: var(--bg-page); min-width: 130px; vertical-align: top; }

  .day-input {
    width: 100%;
    border: none !important;
    background: transparent !important;
    color: var(--text);
    font-size: 12px;
    font-family: inherit;
    resize: none;
    padding: 4px !important;
    line-height: 1.35;
  }
  .day-input:focus { outline: 1px solid var(--accent); border-radius: 4px; }
  .day-input::placeholder { color: #557064; }
  .week-working-input { height: 76px; }
  .week-dayoff-input { height: 44px; }

  /* Monthly calendar (per home, matches the printed wall schedule) */
  table.month-grid { border-collapse: collapse; width: 100%; min-width: 700px; table-layout: fixed; }
  .month-grid th {
    background: var(--bg-elevated);
    padding: 6px;
    text-align: center;
    font-size: 12px;
    border: 1px solid var(--border);
  }
  .month-grid td {
    border: 1px solid var(--border);
    vertical-align: top;
    padding: 3px;
    height: 108px;
    background: var(--bg-page);
  }
  .month-grid td.month-pad { background: var(--bg-card); opacity: 0.35; }
  .month-grid td.is-today { outline: 2px solid var(--accent); outline-offset: -2px; }
  .month-cell-date { font-size: 11px; font-weight: 700; color: var(--text-muted); margin: 1px 2px; }
  .month-grid td.is-today .month-cell-date { color: var(--accent); }
  .month-working-input { height: 46px; }
  .month-dayoff-input { height: 26px; border-top: 1px dashed var(--border) !important; }

  /* ---------- Today view ---------- */
  .today-date { font-size: 20px; font-weight: 800; margin-bottom: 16px; }
  .quote-card {
    text-align: center;
    background: linear-gradient(135deg, var(--bg-card), var(--bg-elevated));
    position: relative;
    padding-top: 8px;
  }
  .quote-mark { font-size: 42px; color: var(--accent); line-height: 1; font-family: Georgia, serif; opacity: 0.6; }
  .quote-text { font-size: 15px; font-style: italic; color: var(--text); max-width: 520px; margin: 0 auto 10px; }
  .quote-author { font-size: 13px; color: var(--accent); font-weight: 600; margin-bottom: 0; }
  .card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 16px;
  }
  .card h3 { font-size: 15px; }
  .card h4.sub { font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); margin-top: 16px; }
  .shift-row { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .shift-row:last-of-type { border-bottom: none; }
  .shift-home { font-weight: 700; min-width: 110px; }
  .shift-slots { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--text-muted); }
  .filled { color: var(--text); font-weight: 600; }
  .filled.night { color: var(--accent); }
  .unfilled { color: var(--danger); font-weight: 600; }
  .reliever-today-row { font-size: 13px; padding: 4px 0; }
  .muted { color: var(--text-muted); font-size: 13px; }

  .inline-form { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .inline-form input[name="title"], .inline-form input[name="name"] { flex: 2; min-width: 140px; }
  .inline-form input[name="note"] { flex: 2; min-width: 140px; }
  .inline-form input[type="time"], .inline-form input[type="date"] { flex: 1; min-width: 110px; }

  .list { display: flex; flex-direction: column; gap: 8px; }
  .reminder-item, .birthday-item, .request-item {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
  }
  .request-item { align-items: flex-start; }
  .request-item-body { flex: 1; }
  .request-item-title { font-weight: 600; font-size: 14px; }
  .request-item-note { color: var(--text-muted); font-size: 13px; margin-top: 3px; white-space: pre-wrap; }
  .late-badge {
    display: inline-block;
    background: var(--danger-bg);
    color: var(--danger-text);
    border: 1px solid var(--danger);
    border-radius: 999px;
    padding: 1px 9px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    vertical-align: middle;
  }
  .reminder-item.done .reminder-title { text-decoration: line-through; color: var(--text-muted); }
  .reminder-body { flex: 1; }
  .reminder-title { font-weight: 600; font-size: 14px; }
  .due-time { color: var(--accent); font-weight: 700; font-size: 12px; }
  .reminder-note { color: var(--text-muted); font-size: 12px; margin-top: 2px; }
  .birthday-item { justify-content: space-between; }
  .birthday-item.today { border-color: var(--accent); }
  .birthday-tag { font-size: 12px; color: var(--text-muted); white-space: nowrap; }
  .birthday-item.today .birthday-tag { color: var(--accent); font-weight: 700; }

  /* ---------- Staff view ---------- */
  select.staff-field {
    background: var(--bg-input);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 14px;
    width: 100%;
  }
  select.staff-field:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .staff-item {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .staff-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .staff-row > * { flex: 1; min-width: 130px; }
  .staff-notes { min-height: 44px; resize: vertical; }
  .staff-item-footer { display: flex; justify-content: flex-end; }

  /* ---------- Chat view ---------- */
  .card-header-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .card-header-row h3 { margin: 0; }
  .chat-card { display: flex; flex-direction: column; }
  .chat-messages {
    display: flex; flex-direction: column; gap: 10px;
    max-height: 55vh; overflow-y: auto;
    padding: 4px 2px; margin-bottom: 12px;
  }
  .chat-bubble {
    max-width: 85%;
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.45;
    white-space: pre-wrap;
  }
  .chat-bubble.user {
    align-self: flex-end;
    background: var(--accent);
    color: var(--accent-contrast);
    border-bottom-right-radius: 4px;
    font-weight: 600;
  }
  .chat-bubble.assistant {
    align-self: flex-start;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }
  .chat-bubble.pending { color: var(--text-muted); font-style: italic; }
  .chat-bubble.error {
    align-self: flex-start;
    background: var(--danger-bg);
    border: 1px solid var(--danger);
    color: var(--danger-text);
  }
  .chat-empty { color: var(--text-muted); font-size: 13px; text-align: center; padding: 24px 0; }
  .chat-input-bar { display: flex; gap: 8px; }
  .chat-input-bar input { flex: 1; }

  @media (max-width: 600px) {
    .app-main { padding: 12px; padding-bottom: 90px; }
    .week-label { order: -1; width: 100%; }
  }

  @media print {
    body { background: #fff; }
    .no-print { display: none !important; }
    .print-only { display: block; }
    .print-title { margin-bottom: 12px; }
    .print-title h2 { margin: 0 0 2px; }
    .schedule-grid, .schedule-grid *,
    .month-grid, .month-grid * {
      color: #000 !important;
      background: #fff !important;
      border-color: #999 !important;
    }
    .schedule-grid td.month-pad, .month-grid td.month-pad { background: #f2f2f2 !important; }
    .day-input { border: none !important; background: transparent !important; }
    .section-title, .week-label, .print-title { color: #000 !important; }
    .app-main { padding-bottom: 0; }
  }
</style>
</head>
<body>

<div id="authScreen" class="auth-screen">
  <div class="auth-card">
    <div class="auth-logo">Tello <span>Staff</span></div>
    <div class="auth-sub">Care home operations</div>
    <div class="auth-tabs">
      <button data-action="auth-tab" data-mode="signin" class="auth-tab active">Sign In</button>
      <button data-action="auth-tab" data-mode="signup" class="auth-tab">Sign Up</button>
    </div>
    <form id="authForm">
      <input id="authEmail" type="email" name="email" placeholder="Email" required autocomplete="username" />
      <input type="password" name="password" placeholder="Password" required autocomplete="current-password" minlength="6" />
      <button type="submit" class="btn-primary full">Sign In</button>
    </form>
    <button class="link-btn" data-action="forgot-password">Forgot password?</button>
    <div id="authMsg" class="auth-msg"></div>
    <div id="configWarning" class="config-warning" style="display:none">
      Supabase anon key is not configured yet. Open app/index.html and set
      <code>SUPABASE_ANON_KEY</code> before this app can sign anyone in.
    </div>
    <div class="auth-footer-links">
      <a href="/">← Tello Staff</a> · <a href="/privacy.html">Privacy</a> · <a href="/terms.html">Terms</a>
    </div>

// ---------------------------------------------------------------------------

function esc(str) {
  return String(str ?? '').replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[c]));
}

function toISODate(d) {
  const tz = new Date(d.getTime() - d.getTimezoneOffset() * 60000);
  return tz.toISOString().slice(0, 10);
}

function startOfWeek(date) {
  const d = new Date(date);
  const day = d.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  d.setDate(d.getDate() + diff);
  d.setHours(0, 0, 0, 0);
  return d;
}

function addDays(date, n) {
  const d = new Date(date);
  d.setDate(d.getDate() + n);
  return d;
}

function fmtShort(date) {
  return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}

function fmtLong(date) {
  return date.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
}

function weekStartForOffset(offset) {
  return addDays(startOfWeek(new Date()), offset * 7);
}

function addMonths(date, n) {
  return new Date(date.getFullYear(), date.getMonth() + n, 1);
}

// Sunday-first weeks of a month, matching the printed wall calendar. Days
// outside the month are represented as null (blank cells, like the paper).
function monthGridWeeks(year, monthIndex) {
  const startPad = new Date(year, monthIndex, 1).getDay();
  const daysInMonth = new Date(year, monthIndex + 1, 0).getDate();
  const cells = [];
  for (let i = 0; i < startPad; i += 1) cells.push(null);
  for (let d = 1; d <= daysInMonth; d += 1) cells.push(new Date(year, monthIndex, d));
  while (cells.length % 7 !== 0) cells.push(null);
  const weeks = [];
  for (let i = 0; i < cells.length; i += 7) weeks.push(cells.slice(i, i + 7));
  return weeks;
}

// ---------------------------------------------------------------------------
// Data — day-by-day schedule (Working / Day Off per home or reliever, per date)
// ---------------------------------------------------------------------------
// Fetches fresh from Supabase every call rather than caching — this is a
// single-admin, low-traffic tool, and per-day rows make "is this cached yet"
// ambiguous (a missing row is a valid "nothing scheduled" state). Returns
// { [entityId]: { [dateStr]: { working, day_off } } }.
async function fetchDaysForEntities(entityKind, entityIds, startStr, endStr) {
  if (!entityIds.length) return {};
  const { data, error } = await sb.from('tello_staff_schedule_days').select('*')
    .eq('user_id', state.user.id)
    .eq('entity_kind', entityKind)
    .in('entity_id', entityIds)
    .gte('date', startStr)
    .lte('date', endStr);
  if (error) console.error(error);
  const map = {};
  (data || []).forEach((row) => {
    map[row.entity_id] = map[row.entity_id] || {};
    map[row.entity_id][row.date] = { working: row.working || '', day_off: row.day_off || '' };
  });
  return map;
}

// The DOM inputs are the live source of truth while typing (no in-memory
// mirror needed) — on save we read both sibling fields for the same
// entity/date so editing one never clobbers the other.
const saveDayTimers = {};
function queueSaveDay(entity, entityId, dateStr) {
  const key = `${entity}:${entityId}:${dateStr}`;
  clearTimeout(saveDayTimers[key]);
  saveDayTimers[key] = setTimeout(() => saveDay(entity, entityId, dateStr), 500);
}

function dayFieldEl(entity, entityId, dateStr, field) {
  return document.querySelector(
    `.day-input[data-entity="${entity}"][data-entity-id="${entityId}"][data-date="${dateStr}"][data-field="${field}"]`
  );
}

async function saveDay(entity, entityId, dateStr) {
  const workingEl = dayFieldEl(entity, entityId, dateStr, 'working');
  const dayOffEl = dayFieldEl(entity, entityId, dateStr, 'day_off');
  const { error } = await sb.from('tello_staff_schedule_days').upsert({
    user_id: state.user.id,
    entity_kind: entity,
    entity_id: entityId,
    date: dateStr,
    working: workingEl ? workingEl.value : '',
    day_off: dayOffEl ? dayOffEl.value : '',
    updated_at: new Date().toISOString(),
  }, { onConflict: 'user_id,entity_kind,entity_id,date' });
  if (error) console.error(error);
}

// Builds a plain-text snapshot of the current week's Schedule Board plus open
// reminders and upcoming birthdays, sent as context so Tello's answers are
// grounded in real assignments instead of guessing.
async function buildScheduleContext() {
  const now = new Date();
  const ws = startOfWeek(now);
  const days = DAY_KEYS.map((k, i) => ({ key: k, label: DAY_LABELS[i], date: addDays(ws, i) }));
  const startStr = toISODate(ws);
  const endStr = toISODate(addDays(ws, 6));

  const homeIds = state.config.homes.map((h) => h.id);
  const relieverIds = state.config.relievers.map((r) => r.id);
  const homeMap = await fetchDaysForEntities('home', homeIds, startStr, endStr);
  const relieverMap = await fetchDaysForEntities('reliever', relieverIds, startStr, endStr);

  const lines = [];
  lines.push(`Today is ${fmtLong(now)}.`);
  lines.push(`This week runs ${fmtShort(ws)} to ${fmtShort(addDays(ws, 6))}.`);
  lines.push('');
  lines.push('HOMES THIS WEEK ((empty) means nobody scheduled):');
  state.config.homes.forEach((home) => {
    const hd = homeMap[home.id] || {};
    lines.push(`${home.name}:`);
    days.forEach((d) => {
      const dateStr = toISODate(d.date);
      const cell = hd[dateStr] || { working: '', day_off: '' };
      const working = cell.working.replace(/\n/g, ', ').trim();
      const dayOff = cell.day_off.replace(/\n/g, ', ').trim();
      lines.push(`  ${d.label} ${fmtShort(d.date)} — Working: ${working || '(none)'}${dayOff ? ` | Day off: ${dayOff}` : ''}`);
    });
  });
  lines.push('');
  lines.push('RELIEVER POOL THIS WEEK:');
  state.config.relievers.forEach((r) => {
    const rd = relieverMap[r.id] || {};
    const deployed = days
      .map((d) => {
        const val = (rd[toISODate(d.date)] || {}).working;
        return val ? `${d.label}: ${val}` : null;
      })
      .filter(Boolean);
    lines.push(`  ${r.name} — ${deployed.length ? deployed.join(', ') : 'no deployments logged this week'}`);
  });
  lines.push('');
  const openReminders = state.reminders.filter((r) => !r.done);
  lines.push(`OPEN REMINDERS: ${openReminders.length ? openReminders.map((r) => `${r.title}${r.due_time ? ` (${r.due_time})` : ''}`).join('; ') : 'none'}`);
  const upcomingBdays = state.birthdays
    .map((b) => ({ b, diff: nextBirthdayDiff(b.bday_month, b.bday_day, now) }))
    .filter((x) => x.diff <= 14)
    .sort((a, b) => a.diff - b.diff);
  lines.push(`BIRTHDAYS IN THE NEXT 2 WEEKS: ${upcomingBdays.length ? upcomingBdays.map((x) => `${x.b.name} (${x.diff === 0 ? 'today' : `in ${x.diff}d`})`).join('; ') : 'none'}`);

  return lines.join('\n');
}

async function sendChatMessage(text) {
  state.chatMessages.push({ role: 'user', content: text });
  state.chatSending = true;
  renderChat();

  const { error: insertErr } = await sb.from('tello_staff_chat_messages')
    .insert({ user_id: state.user.id, role: 'user', content: text });
  if (insertErr) console.error(insertErr);

  try {
    const context = await buildScheduleContext();
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        messages: state.chatMessages.map((m) => ({ role: m.role, content: m.content })),
        context,
      }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
    state.chatMessages.push({ role: 'assistant', content: data.reply });
    const { error: insertErr2 } = await sb.from('tello_staff_chat_messages')
      .insert({ user_id: state.user.id, role: 'assistant', content: data.reply });
    if (insertErr2) console.error(insertErr2);
  } catch (err) {
    state.chatMessages.push({ role: 'assistant', content: `Could not reach Tello: ${err.message}`, isError: true });
  } finally {
    state.chatSending = false;
    renderChat();
  }
}

  if (view) view.classList.add('active');
  if (state.tab === 'schedule') renderSchedule();
  if (state.tab === 'today') renderToday();
  if (state.tab === 'chat') renderChat();
  if (state.tab === 'staff') renderStaff();
}

async function renderSchedule() {
  if (state.config.homes.length && !state.config.homes.some((h) => h.id === state.selectedHomeId)) {
    state.selectedHomeId = state.config.homes[0].id;
  }
  const home = state.config.homes.find((h) => h.id === state.selectedHomeId) || null;
  const todayStr = toISODate(new Date());
  const assignedStaff = home ? state.staff.filter((s) => s.home_id === home.id) : [];

  let periodLabel = '';
  let gridHtml = `<div class="muted">Add a home in Manage to start scheduling.</div>`;

  if (home) {
    if (state.scheduleView === 'week') {
      const ws = weekStartForOffset(state.weekOffset);
      const days = DAY_KEYS.map((k, i) => ({ key: k, label: DAY_LABELS[i], date: addDays(ws, i) }));
      const startStr = toISODate(ws);
      const endStr = toISODate(addDays(ws, 6));
      periodLabel = `${fmtShort(ws)} – ${fmtShort(addDays(ws, 6))}, ${addDays(ws, 6).getFullYear()}`;
      const homeMap = (await fetchDaysForEntities('home', [home.id], startStr, endStr))[home.id] || {};
      gridHtml = renderHomeWeekTable(days, homeMap, todayStr);
    } else {
      const mo = addMonths(new Date(), state.monthOffset);
      const year = mo.getFullYear();
      const monthIndex = mo.getMonth();
      const weeks = monthGridWeeks(year, monthIndex);
      const startStr = toISODate(new Date(year, monthIndex, 1));
      const endStr = toISODate(new Date(year, monthIndex + 1, 0));
      periodLabel = mo.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
      const homeMap = (await fetchDaysForEntities('home', [home.id], startStr, endStr))[home.id] || {};
      gridHtml = renderHomeMonthTable(weeks, homeMap, todayStr, home.id);
    }
  }

  // Reliever pool always shows the current real week — a short-horizon
  // floating resource, not something browsed by month.
  const thisWeekStart = startOfWeek(new Date());
  const thisWeekDays = DAY_KEYS.map((k, i) => ({ key: k, label: DAY_LABELS[i], date: addDays(thisWeekStart, i) }));
  const relieverIds = state.config.relievers.map((r) => r.id);
  const relieverMap = await fetchDaysForEntities(
    'reliever', relieverIds, toISODate(thisWeekStart), toISODate(addDays(thisWeekStart, 6))
  );
  const relieverRows = state.config.relievers
    .map((r) => renderRelieverWeekRow(r, thisWeekDays, relieverMap[r.id] || {}))
    .join('');
  const relieverDayHeaders = thisWeekDays.map((d) => `
    <th class="${toISODate(d.date) === todayStr ? 'is-today' : ''}">
      ${d.label}<br><span class="day-date">${fmtShort(d.date)}</span>
    </th>`).join('');

  const managePanel = state.manageOpen ? `
    <div id="managePanel" class="manage-panel no-print">
      <div class="manage-col">
        <h4>Homes</h4>
        <div class="manage-list">
          ${state.config.homes.map((h) => `
            <div class="manage-row">
              <input type="text" class="manage-name-input" data-kind="home-name" data-id="${h.id}" value="${esc(h.name)}" />
              <button class="btn-remove" data-action="remove-home" data-id="${h.id}">✕</button>
            </div>`).join('')}
        </div>
        <button class="btn-outline" data-action="add-home">+ Add Home</button>
      </div>
      <div class="manage-col">
        <h4>Reliever Pool</h4>
        <div class="manage-list">
          ${state.config.relievers.map((r) => `
            <div class="manage-row">
              <input type="text" class="manage-name-input" data-kind="reliever-name" data-id="${r.id}" value="${esc(r.name)}" />
              <button class="btn-remove" data-action="remove-reliever" data-id="${r.id}">✕</button>
            </div>`).join('')}
        </div>
        <button class="btn-outline" data-action="add-reliever">+ Add Reliever</button>
      </div>
      <div class="manage-col">
        <h4>Share Links</h4>
        <div class="manage-list">
          ${state.config.homes.map((h) => {
            const link = state.shareLinks.find((l) => l.home_id === h.id && !l.revoked_at);
            return `
              <div class="manage-row share-row">
                <div class="share-row-name">${esc(h.name)}</div>
                ${link
                  ? `<button class="btn-outline small" data-action="copy-share-link" data-token="${esc(link.token)}">📋 Copy Link</button>
                     <button class="btn-remove" data-action="revoke-share-link" data-id="${link.id}">Revoke</button>`
                  : `<button class="btn-outline small" data-action="create-share-link" data-home="${h.id}">🔗 Create Link</button>`}
              </div>`;
          }).join('')}
        </div>
        <p style="font-size:12px;">Read-only schedule for caregivers, no login needed.</p>
      </div>
    </div>` : '';

  document.getElementById('view-schedule').innerHTML = `
    <div class="week-bar no-print">
      <select class="home-select" data-kind="select-home">
        ${state.config.homes.map((h) => `<option value="${h.id}" ${h.id === state.selectedHomeId ? 'selected' : ''}>${esc(h.name)}</option>`).join('')}
      </select>
      <div class="view-toggle">
        <button data-action="view-week" class="${state.scheduleView === 'week' ? 'active' : ''}">Week</button>
        <button data-action="view-month" class="${state.scheduleView === 'month' ? 'active' : ''}">Month</button>
      </div>
      <button class="btn-icon" data-action="prev-period" title="Previous">‹</button>
      <div class="week-label">${periodLabel}</div>
      <button class="btn-icon" data-action="next-period" title="Next">›</button>
      <button class="btn-outline" data-action="today-period">Today</button>
      <button class="btn-outline" data-action="manage-toggle">⚙ Manage</button>
      <button class="btn-outline" data-action="print">🖨 Print</button>
    </div>
    ${managePanel}
    <div class="print-only print-title">
      <h2>${esc(home ? home.name : 'Tello Staff')}</h2>
      <div>${periodLabel}</div>
    </div>
    ${home ? `
      <div class="assigned-staff-strip no-print">
        <span class="assigned-staff-label">Staff assigned to ${esc(home.name)}:</span>
        ${assignedStaff.length
          ? assignedStaff.map((s) => `<button type="button" class="staff-chip" data-action="insert-staff-name" data-name="${esc(s.name)}">${esc(s.name)}</button>`).join('')
          : `<span class="muted">None yet — assign staff to this home in the Staff tab.</span>`}
      </div>` : ''}
    ${gridHtml}
    <h3 class="section-title">Reliever Pool — This Week</h3>
    <div class="grid-wrap no-print">
      <table class="schedule-grid" id="relieversTable">
        <thead><tr><th class="row-head">Reliever</th>${relieverDayHeaders}</tr></thead>
        <tbody>${relieverRows}</tbody>
      </table>
    </div>
  `;
}

function renderHomeWeekTable(days, homeMap, todayStr) {
  const dayHeaderCells = days.map((d) => `
    <th class="${toISODate(d.date) === todayStr ? 'is-today' : ''}">
      ${d.label}<br><span class="day-date">${fmtShort(d.date)}</span>
    </th>`).join('');

  const fieldRow = (field, label, cssClass) => `
    <tr>
      <td class="slot-label">${label}</td>
      ${days.map((d) => {
        const dateStr = toISODate(d.date);
        const val = (homeMap[dateStr] || {})[field] || '';
        return `<td><textarea class="day-input ${cssClass}" data-entity="home" data-entity-id="${state.selectedHomeId}" data-date="${dateStr}" data-field="${field}" placeholder="—">${esc(val)}</textarea></td>`;
      }).join('')}
    </tr>`;

  return `
    <div class="grid-wrap">
      <table class="schedule-grid" id="homeWeekTable">
        <thead><tr><th class="row-head">Field</th>${dayHeaderCells}</tr></thead>
        <tbody>
          ${fieldRow('working', 'Working', 'week-working-input')}
          ${fieldRow('day_off', 'Day Off', 'week-dayoff-input')}
        </tbody>
      </table>
    </div>`;
}

function renderHomeMonthTable(weeks, homeMap, todayStr, homeId) {
  const headerCells = DAY_LABELS_SUN.map((label) => `<th>${label}</th>`).join('');
  const bodyRows = weeks.map((week) => `
    <tr>
      ${week.map((date) => {
        if (!date) return `<td class="month-pad"></td>`;
        const dateStr = toISODate(date);
        const cell = homeMap[dateStr] || { working: '', day_off: '' };
        return `
          <td class="${dateStr === todayStr ? 'is-today' : ''}">
            <div class="month-cell-date">${date.getDate()}</div>
            <textarea class="day-input month-working-input" data-entity="home" data-entity-id="${homeId}" data-date="${dateStr}" data-field="working" placeholder="Working">${esc(cell.working)}</textarea>
            <textarea class="day-input month-dayoff-input" data-entity="home" data-entity-id="${homeId}" data-date="${dateStr}" data-field="day_off" placeholder="Day off">${esc(cell.day_off)}</textarea>
          </td>`;
      }).join('')}
    </tr>`).join('');

  return `
    <div class="grid-wrap">
      <table class="month-grid" id="homeMonthTable">
        <thead><tr>${headerCells}</tr></thead>
        <tbody>${bodyRows}</tbody>
      </table>
    </div>`;
}

function renderRelieverWeekRow(reliever, days, relieverDayMap) {
  return `
    <tr>
      <th class="row-head">${esc(reliever.name)}</th>
      ${days.map((d) => {
        const dateStr = toISODate(d.date);
        const val = (relieverDayMap[dateStr] || {}).working || '';
        return `<td><input type="text" class="day-input" data-entity="reliever" data-entity-id="${reliever.id}" data-date="${dateStr}" data-field="working" value="${esc(val)}" placeholder="—" /></td>`;
      }).join('')}
    </tr>`;
}

// Adds a name to whichever Working box was last focused, so tapping a chip
// from the "Staff assigned to this home" strip fills in a shift without
// retyping — this is the only link between the Staff directory and the
// Schedule Board, which are otherwise fully independent by design.
let lastFocusedWorkingInput = null;
function insertStaffNameIntoFocusedCell(name) {
  const target = lastFocusedWorkingInput;
  if (!target || !document.body.contains(target)) {
    window.alert('Click into a "Working" box first, then tap a name to add it.');
    return;
  }
  const sep = target.value.trim() ? '\n' : '';
  target.value = target.value + sep + name;
  target.dispatchEvent(new Event('input', { bubbles: true }));
  target.focus();
}

// The policy is "day off requests must arrive by end of the month before
// the time off" — e.g. a November day off is due by Oct 31. That deadline
// is the first instant of the requested month, so submitting on or after
// that instant is late. Only checked when a specific date was given; a
// dateless note (general flag, short-notice cover ask) isn't held to it.
function isRequestLate(requestDateStr, createdAtStr) {
  if (!requestDateStr) return false;
  const [y, m] = requestDateStr.split('-').map(Number);
  const deadline = new Date(y, m - 1, 1);
  return new Date(createdAtStr) >= deadline;
}

function renderRequestsCard() {
  const open = state.requests.filter((r) => r.status === 'open');
  if (!open.length) return '';
  return `
    <section class="card">
      <h3>Requests (${open.length})</h3>
      <div class="list">
        ${open.map((r) => {
          const late = isRequestLate(r.request_date, r.created_at);
          return `
          <div class="request-item">
            <div class="request-item-body">
              <div class="request-item-title">${esc(r.staff_name)} — ${esc(r.home_name)}${r.request_date ? ` · ${esc(r.request_date)}` : ''}${late ? ' <span class="late-badge">Late</span>' : ''}</div>
              <div class="request-item-note">${esc(r.note)}</div>
            </div>
            <button class="btn-outline small" data-action="request-handled" data-id="${r.id}">Mark Handled</button>
          </div>`;
        }).join('')}
      </div>
    </section>`;
}

function nextBirthdayDiff(month, day, now) {
  const year = now.getFullYear();
  const today0 = new Date(now); today0.setHours(0, 0, 0, 0);
  let next = new Date(year, month - 1, day);
  if (next < today0) next = new Date(year + 1, month - 1, day);
  return Math.round((next - today0) / 86400000);
}

function renderBirthdays(now) {
  if (!state.birthdays.length) return `<div class="muted">No birthdays added yet.</div>`;
  const withDiff = state.birthdays
    .map((b) => ({ b, diff: nextBirthdayDiff(b.bday_month, b.bday_day, now) }))
    .sort((a, b) => a.diff - b.diff);
  return withDiff.map(({ b, diff }) => {
    const label = diff === 0 ? 'Today!' : diff === 1 ? 'Tomorrow' : `in ${diff} days`;
    const monthName = new Date(2000, b.bday_month - 1, 1).toLocaleDateString('en-US', { month: 'short' });
    return `
      <div class="birthday-item ${diff === 0 ? 'today' : ''}">
        <div><b>${esc(b.name)}</b> — ${monthName} ${b.bday_day}</div>
        <div class="birthday-tag">${label}</div>
        <button class="btn-remove" data-action="birthday-delete" data-id="${b.id}">✕</button>
      </div>`;
  }).join('');
}

// ---------------------------------------------------------------------------
// Event delegation
// ---------------------------------------------------------------------------
function onGlobalClick(e) {
  const btn = e.target.closest('[data-action]');
  if (!btn) return;
  const action = btn.dataset.action;
  switch (action) {
    case 'nav-tab':
      state.tab = btn.dataset.tab;
      renderApp();
      break;
    case 'sign-out':
      handleSignOut();
      break;
    case 'view-week':
      state.scheduleView = 'week';
      renderSchedule();
      break;
    case 'view-month':
      state.scheduleView = 'month';
      renderSchedule();
      break;
    case 'prev-period':
      if (state.scheduleView === 'week') state.weekOffset -= 1; else state.monthOffset -= 1;
      renderSchedule();
      break;
    case 'next-period':
      if (state.scheduleView === 'week') state.weekOffset += 1; else state.monthOffset += 1;
      renderSchedule();
      break;
    case 'today-period':
      if (state.scheduleView === 'week') state.weekOffset = 0; else state.monthOffset = 0;
      renderSchedule();
      break;
    case 'manage-toggle':
      state.manageOpen = !state.manageOpen;
      renderSchedule();
      break;
    case 'print':
      window.print();
      break;
    case 'add-home':
      state.config.homes.push({ id: crypto.randomUUID(), name: `Home ${state.config.homes.length + 1}` });
      saveConfig();
      renderSchedule();
      break;
    case 'remove-home':
      state.config.homes = state.config.homes.filter((h) => h.id !== btn.dataset.id);
      saveConfig();
      renderSchedule();
      break;
    case 'add-reliever':
      state.config.relievers.push({ id: crypto.randomUUID(), name: `Reliever ${state.config.relievers.length + 1}` });
      saveConfig();
      renderSchedule();
      break;
    case 'remove-reliever':
      state.config.relievers = state.config.relievers.filter((r) => r.id !== btn.dataset.id);
      saveConfig();
      renderSchedule();
      break;
    case 'reminder-delete':
      deleteReminder(btn.dataset.id);
      break;
    case 'birthday-delete':
      deleteBirthday(btn.dataset.id);
      break;
    case 'auth-tab':
      state.authMode = btn.dataset.mode;
      renderAuth();
      break;
    case 'forgot-password':
      handleForgotPassword(document.getElementById('authEmail').value.trim());
      break;
    case 'clear-chat':
      clearChatHistory();
      break;
    case 'staff-delete':
      deleteStaffMember(btn.dataset.id);
      break;
    case 'toggle-theme':
      toggleTheme();
      break;
    case 'create-share-link':
      createShareLink(btn.dataset.home);
      break;
    case 'copy-share-link':
      copyShareLink(btn.dataset.token);
      break;
    case 'revoke-share-link':
      revokeShareLink(btn.dataset.id);
      break;
    case 'request-handled':
      markRequestHandled(btn.dataset.id);
      break;
    case 'insert-staff-name':
      insertStaffNameIntoFocusedCell(btn.dataset.name);
      break;
  }
}

function onGlobalSubmit(e) {
  const form = e.target;
  if (form.dataset.form === 'reminder') {
    e.preventDefault();
    const fd = new FormData(form);
    const title = fd.get('title').trim();
    if (!title) return;
    addReminder(title, fd.get('note').trim(), fd.get('due_time'));
    form.reset();
  } else if (form.dataset.form === 'birthday') {
    e.preventDefault();
    const fd = new FormData(form);
    const name = fd.get('name').trim();
    const dateVal = fd.get('date');
    if (!name || !dateVal) return;
    const [, m, d] = dateVal.split('-').map(Number);
    addBirthday(name, m, d);
    form.reset();
  } else if (form.dataset.form === 'chat') {
    e.preventDefault();
    const fd = new FormData(form);
    const text = fd.get('message').trim();
    if (!text || state.chatSending) return;
    form.reset();
    sendChatMessage(text);
  } else if (form.dataset.form === 'staff') {
    e.preventDefault();
    const fd = new FormData(form);
    const name = fd.get('name').trim();
    if (!name) return;
    addStaffMember(name, fd.get('role').trim(), fd.get('contact').trim(), fd.get('home_id'));
    form.reset();
  } else if (form.id === 'authForm') {
    e.preventDefault();
    handleAuthSubmit(form);
  }
}

function onGlobalInput(e) {
  const t = e.target;
  if (!t.classList.contains('day-input')) return;
  const { entity, entityId, date } = t.dataset;
  queueSaveDay(entity, entityId, date);
}

function onGlobalChange(e) {
  const t = e.target;
  if (t.dataset.kind === 'reminder-done') {
    toggleReminder(t.dataset.id, t.checked);
  } else if (t.dataset.kind === 'home-name') {
    const home = state.config.homes.find((h) => h.id === t.dataset.id);
    if (home) { home.name = t.value; saveConfig(); renderSchedule(); }
  } else if (t.dataset.kind === 'reliever-name') {
    const rel = state.config.relievers.find((r) => r.id === t.dataset.id);
    if (rel) { rel.name = t.value; saveConfig(); renderSchedule(); }
  } else if (t.dataset.kind === 'select-home') {
    state.selectedHomeId = t.value;
    renderSchedule();
  } else if (t.dataset.kind === 'staff-field') {
    updateStaffField(t.dataset.id, t.dataset.field, t.value.trim());
  } else if (t.dataset.kind === 'staff-home') {
    updateStaffField(t.dataset.id, 'home_id', t.value);
  }
}

// ---------------------------------------------------------------------------
// Init
// ---------------------------------------------------------------------------
// ---------------------------------------------------------------------------
// Theme (light/dark background toggle)
// ---------------------------------------------------------------------------
const THEME_KEY = 'tello-staff-theme';

function applyTheme(theme) {
  document.documentElement.dataset.theme = theme;
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', theme === 'light' ? '#ffffff' : '#1a3a2e');
  const btn = document.getElementById('themeToggleBtn');
  if (btn) btn.textContent = theme === 'light' ? '🌙' : '☀️';
}

function initTheme() {
  let saved = 'dark';
  try { saved = localStorage.getItem(THEME_KEY) || 'dark'; } catch { /* private mode etc. */ }
  applyTheme(saved);
}

function toggleTheme() {
  const next = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
  applyTheme(next);
  try { localStorage.setItem(THEME_KEY, next); } catch { /* private mode etc. */ }
}

function init() {
  document.addEventListener('click', onGlobalClick);
  document.addEventListener('submit', onGlobalSubmit);
  document.addEventListener('input', onGlobalInput);
  document.addEventListener('change', onGlobalChange);
  document.addEventListener('focusin', (e) => {
    if (e.target.classList.contains('day-input') && e.target.dataset.field === 'working') {
      lastFocusedWorkingInput = e.target;
    }
  });

  initTheme();

  sb.auth.onAuthStateChange((_event, session) => {
    if (session && session.user) enterApp(session.user);
    else showAuthScreen();
  });
}

init();
</script>
