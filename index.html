<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<meta name="theme-color" content="#1a3a2e" />
<meta name="color-scheme" content="dark" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Tello Staff</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg-page: #0f2019;
    --bg-app: #1a3a2e;
    --bg-card: #204638;
    --bg-elevated: #2a5644;
    --bg-input: #17332a;
    --border: #3a6b54;
    --text: #eef6f1;
    --text-muted: #a8c6b6;
    --accent: #e8c15c;
    --accent-contrast: #1a3a2e;
    --positive: #6bd39a;
    --danger: #e5726b;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg-page);
    color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button, input { font-family: inherit; }
  h1, h2, h3, h4 { margin: 0 0 8px; font-weight: 700; }
  p { margin: 0 0 8px; color: var(--text-muted); }

  /* ---------- Auth screen ---------- */
  .auth-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: radial-gradient(circle at 50% 0%, #234a3b, var(--bg-page) 70%);
  }
  .auth-card {
    width: 100%;
    max-width: 380px;
    background: var(--bg-app);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px 28px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }
  .auth-logo {
    font-size: 28px;
    font-weight: 800;
    text-align: center;
    margin-bottom: 4px;
    letter-spacing: 0.5px;
  }
  .auth-logo span { color: var(--accent); }
  .auth-sub {
    text-align: center;
    font-size: 13px;
    margin-bottom: 24px;
  }
  .auth-tabs {
    display: flex;
    background: var(--bg-input);
    border-radius: 8px;
    padding: 4px;
    margin-bottom: 20px;
  }
  .auth-tab {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--text-muted);
    padding: 8px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 600;
    font-size: 14px;
  }
  .auth-tab.active { background: var(--accent); color: var(--accent-contrast); }
  #authForm { display: flex; flex-direction: column; gap: 12px; }
  .link-btn {
    display: block;
    width: 100%;
    background: none;
    border: none;
    color: var(--text-muted);
    text-decoration: underline;
    font-size: 13px;
    margin-top: 14px;
    cursor: pointer;
    text-align: center;
  }
  .auth-msg {
    margin-top: 14px;
    font-size: 13px;
    text-align: center;
    min-height: 16px;
    color: var(--positive);
  }
  .auth-msg.error { color: var(--danger); }
  .config-warning {
    margin-top: 18px;
    padding: 10px 12px;
    background: rgba(229, 114, 107, 0.15);
    border: 1px solid var(--danger);
    border-radius: 8px;
    font-size: 12px;
    color: #f3b3ae;
  }

  /* ---------- Inputs / buttons ---------- */
  input[type="text"], input[type="email"], input[type="password"], input[type="time"], input[type="date"], select {
    background: var(--bg-input);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 14px;
    width: 100%;
  }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  input::placeholder { color: #6f9284; }

  .btn-primary {
    background: var(--accent);
    color: var(--accent-contrast);
    border: none;
    padding: 10px 16px;
    border-radius: 8px;
    font-weight: 700;
    cursor: pointer;
    font-size: 14px;
    white-space: nowrap;
  }
  .btn-primary.full { width: 100%; }
  .btn-outline {
    background: var(--bg-elevated);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
  }
  .btn-outline.small { padding: 6px 10px; font-size: 12px; }
  .btn-icon {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    color: var(--text);
    width: 36px; height: 36px;
    border-radius: 8px;
    font-size: 18px;
    cursor: pointer;
  }
  .btn-remove {
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 14px;
    padding: 4px 8px;
  }
  .btn-remove:hover { color: var(--danger); }

  /* ---------- App shell ---------- */
  .app { min-height: 100vh; display: flex; flex-direction: column; }
  .app-header {
    background: var(--bg-app);
    border-bottom: 1px solid var(--border);
    padding: 14px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 5;
  }
  .app-title { font-size: 18px; font-weight: 800; }
  .app-title span { color: var(--accent); }
  .app-main {
    flex: 1;
    padding: 16px;
    padding-bottom: 90px;
    max-width: 1100px;
    width: 100%;
    margin: 0 auto;
  }
  .view { display: none; }
  .view.active { display: block; }
  .view.placeholder-view.active { display: flex; }

  .bottom-nav {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--bg-app);
    border-top: 1px solid var(--border);
    display: flex;
    padding: 6px 6px calc(6px + env(safe-area-inset-bottom));
    z-index: 10;
  }
  .nav-btn {
    flex: 1;
    background: none;
    border: none;
    color: var(--text-muted);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    padding: 8px 4px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 11px;
    font-weight: 600;
  }
  .nav-btn .nav-icon { font-size: 20px; }
  .nav-btn.active { color: var(--accent); background: rgba(232, 193, 92, 0.1); }
  .nav-btn.nav-hidden { display: none; }

  .role-badge {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--accent);
    background: rgba(232, 193, 92, 0.15);
    border: 1px solid var(--accent);
    border-radius: 999px;
    padding: 3px 10px;
  }

  .placeholder-view { align-items: center; justify-content: center; min-height: 50vh; }
  .placeholder { text-align: center; color: var(--text-muted); max-width: 320px; }
  .placeholder-icon { font-size: 40px; margin-bottom: 12px; }

  /* ---------- Schedule view ---------- */
  .week-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }
  .week-label { font-weight: 700; font-size: 15px; flex: 1; text-align: center; min-width: 160px; }
  .section-title { margin-top: 28px; margin-bottom: 12px; font-size: 16px; }

  .manage-panel {
    display: flex;
    gap: 24px;
    flex-wrap: wrap;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 20px;
  }
  .manage-col { flex: 1; min-width: 220px; }
  .manage-col h4 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); }
  .manage-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
  .manage-row { display: flex; align-items: center; gap: 6px; }
  .manage-name-input { flex: 1; }

  .grid-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius); }
  table.schedule-grid {
    border-collapse: collapse;
    width: 100%;
    min-width: 760px;
  }
  .schedule-grid th, .schedule-grid td {
    border: 1px solid var(--border);
    padding: 6px 8px;
    text-align: left;
    font-size: 13px;
  }
  .schedule-grid thead th {
    background: var(--bg-elevated);
    font-size: 12px;
    text-align: center;
    white-space: nowrap;
  }
  .schedule-grid thead th.is-today { color: var(--accent); }
  .day-date { font-weight: 400; color: var(--text-muted); font-size: 11px; }
  .schedule-grid th.row-head {
    background: var(--bg-card);
    font-weight: 700;
    white-space: nowrap;
    vertical-align: middle;
  }
  .schedule-grid td.slot-label {
    background: var(--bg-card);
    color: var(--text-muted);
    white-space: nowrap;
    font-size: 12px;
  }
  .schedule-grid td.slot-label.is-night { color: var(--accent); }
  .schedule-grid td { background: var(--bg-page); min-width: 96px; position: relative; }
  .cell-input {
    display: block;
    border: none !important;
    background: transparent !important;
    padding: 4px !important;
    width: 100%;
    color: var(--text);
    font-size: 13px;
    font-family: inherit;
  }
  .cell-input:focus { outline: 1px solid var(--accent); border-radius: 4px; }
  .cell-input.cell-location { font-size: 11px; color: var(--text-muted); border-top: 1px dashed var(--border) !important; }
  /* Gap detection: filled = green, empty = red, approved day off = gray */
  td.cell-filled { background: rgba(107, 211, 154, 0.10) !important; }
  td.cell-empty { background: rgba(229, 114, 107, 0.14) !important; }
  td.cell-dayoff { background: rgba(150, 150, 150, 0.28) !important; }
  .dayoff-badge { position: absolute; top: 2px; right: 4px; font-size: 11px; pointer-events: none; }

  .reliever-toggle { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; margin-top: 28px; }
  .view-toggle { display: flex; background: var(--bg-input); border-radius: 8px; padding: 4px; width: auto; }
  .view-toggle button { flex: 0 0 auto; background: transparent; border: none; color: var(--text-muted); padding: 6px 14px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 13px; }
  .view-toggle button.active { background: var(--accent); color: var(--accent-contrast); }

  table.month-grid { table-layout: fixed; min-width: 720px; }
  .month-grid th { background: var(--bg-elevated); text-align: center; font-size: 12px; padding: 6px; }
  td.month-cell { vertical-align: top; padding: 6px; min-width: 96px; height: 92px; background: var(--bg-page); }
  td.month-cell.outside { opacity: 0.35; }
  td.month-cell.empty { background: rgba(229, 114, 107, 0.14) !important; }
  .month-daynum { font-size: 11px; color: var(--text-muted); margin-bottom: 4px; }
  .month-entry { font-size: 11px; margin-bottom: 2px; padding: 1px 4px; border-radius: 4px; word-break: break-word; }
  .month-entry.filled { background: rgba(107, 211, 154, 0.18); }
  .month-entry.dayoff { background: rgba(150, 150, 150, 0.3); color: var(--text-muted); }
  .month-entry.no-relievers { color: var(--danger); font-weight: 600; }
  .month-loc { color: var(--text-muted); }

  /* ---------- Today view ---------- */
  .today-date { font-size: 20px; font-weight: 800; margin-bottom: 16px; }
  .card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 16px;
  }
  .card h3 { font-size: 15px; }
  .card h4.sub { font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); margin-top: 16px; }
  .shift-row { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .shift-row:last-of-type { border-bottom: none; }
  .shift-home { font-weight: 700; min-width: 110px; }
  .shift-slots { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--text-muted); }
  .filled { color: var(--text); font-weight: 600; }
  .filled.night { color: var(--accent); }
  .unfilled { color: var(--danger); font-weight: 600; }
  .reliever-today-row { font-size: 13px; padding: 4px 0; }
  .muted { color: var(--text-muted); font-size: 13px; }

  .inline-form { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .inline-form input[name="title"], .inline-form input[name="name"] { flex: 2; min-width: 140px; }
  .inline-form input[name="note"] { flex: 2; min-width: 140px; }
  .inline-form input[type="time"], .inline-form input[type="date"] { flex: 1; min-width: 110px; }

  .list { display: flex; flex-direction: column; gap: 8px; }
  .reminder-item, .birthday-item {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
  }
  .reminder-item.done .reminder-title { text-decoration: line-through; color: var(--text-muted); }
  .reminder-body { flex: 1; }
  .reminder-title { font-weight: 600; font-size: 14px; }
  .due-time { color: var(--accent); font-weight: 700; font-size: 12px; }
  .reminder-note { color: var(--text-muted); font-size: 12px; margin-top: 2px; }
  .birthday-item { justify-content: space-between; }
  .birthday-item.today { border-color: var(--accent); }
  .birthday-tag { font-size: 12px; color: var(--text-muted); white-space: nowrap; }
  .birthday-item.today .birthday-tag { color: var(--accent); font-weight: 700; }

  @media (max-width: 600px) {
    .app-main { padding: 12px; padding-bottom: 90px; }
    .week-label { order: -1; width: 100%; }
  }

  @media print {
    body { background: #fff; }
    .no-print { display: none !important; }
    .schedule-grid, .schedule-grid * {
      color: #000 !important;
      background: #fff !important;
      border-color: #bbb !important;
    }
    .schedule-grid input, .schedule-grid select { border: none !important; background: transparent !important; appearance: none; -webkit-appearance: none; }
    .section-title, .week-label { color: #000 !important; }
    .app-main { padding-bottom: 0; }
  }
</style>
</head>
<body>

<div id="authScreen" class="auth-screen">
  <div class="auth-card">
    <div class="auth-logo">Tello <span>Staff</span></div>
    <div class="auth-sub">Care home operations</div>
    <div class="auth-tabs">
      <button data-action="auth-tab" data-mode="signin" class="auth-tab active">Sign In</button>
      <button data-action="auth-tab" data-mode="signup" class="auth-tab">Sign Up</button>
    </div>
    <form id="authForm">
      <input id="authEmail" type="email" name="email" placeholder="Email" required autocomplete="username" />
      <input type="password" name="password" placeholder="Password" required autocomplete="current-password" minlength="6" />
      <button type="submit" class="btn-primary full">Sign In</button>
    </form>
    <button class="link-btn" data-action="forgot-password">Forgot password?</button>
    <div id="authMsg" class="auth-msg"></div>
    <div id="configWarning" class="config-warning" style="display:none">
      Supabase anon key is not configured yet. Open index.html and set
      <code>SUPABASE_ANON_KEY</code> before this app can sign anyone in.
    </div>
  </div>
</div>

<div id="app" class="app" style="display:none">
  <header class="app-header no-print">
    <div class="app-title">Tello <span>Staff</span></div>
    <div style="display:flex; align-items:center; gap:10px;">
      <span id="roleBadge" class="role-badge" style="display:none">Caregiver</span>
      <button class="btn-outline small" data-action="sign-out">Sign Out</button>
    </div>
  </header>

  <main class="app-main">
    <div id="view-schedule" class="view"></div>

    <div id="view-today" class="view"></div>

    <div id="view-staff" class="view"></div>

    <div id="view-chat" class="view placeholder-view">
      <div class="placeholder">
        <div class="placeholder-icon">💬</div>
        <h2>Chat</h2>
        <p>Tello, the AI operations advisor, is coming in the next session.</p>
      </div>
    </div>

    <div id="view-dayoff" class="view"></div>
  </main>

  <nav class="bottom-nav no-print">
    <button class="nav-btn" data-action="nav-tab" data-tab="schedule">
      <span class="nav-icon">🗓️</span><span>Schedule</span>
    </button>
    <button class="nav-btn" data-action="nav-tab" data-tab="today">
      <span class="nav-icon">☀️</span><span>Today</span>
    </button>
    <button class="nav-btn" data-action="nav-tab" data-tab="staff" data-role="admin">
      <span class="nav-icon">👥</span><span>Staff</span>
    </button>
    <button class="nav-btn" data-action="nav-tab" data-tab="chat" data-role="admin">
      <span class="nav-icon">💬</span><span>Chat</span>
    </button>
    <button class="nav-btn" data-action="nav-tab" data-tab="dayoff" data-role="caregiver">
      <span class="nav-icon">📋</span><span>Day Off</span>
    </button>
  </nav>
</div>

<script>
// ============================================================================
// CONFIG — fill in SUPABASE_ANON_KEY (Project Settings → API) before deploying.
// REDIRECT_URL must stay the exact Cloudflare Pages production URL, since it
// also has to be listed in Supabase → Authentication → URL Configuration.
// ============================================================================
const SUPABASE_URL = 'https://nwlhsshvqmbhemhxcran.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im53bGhzc2h2cW1iaGVtaHhjcmFuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk5OTEzOTIsImV4cCI6MjA5NTU2NzM5Mn0.2yASMx57IUNjEW8bMs8FwXnIz4cLsE1ftqD35QAOqE8';
const REDIRECT_URL = 'https://tello-staff.pages.dev';

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: { persistSession: true, autoRefreshToken: true },
});

// Separate client, session not persisted — used only to sign up a new
// caregiver/admin login from the Staff tab without swapping out the
// currently signed-in admin's session on the main `sb` client.
const sbProvision = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: { persistSession: false, autoRefreshToken: false },
});

// ---------------------------------------------------------------------------
// State
// ---------------------------------------------------------------------------
const state = {
  user: null,
  role: 'admin',
  orgId: null,
  staffMemberId: null,
  tab: 'schedule',
  authMode: 'signin',
  config: { homes: [], relievers: [] },
  weekOffset: 0,
  relieverViewMode: 'week',
  monthOffset: 0,
  manageOpen: false,
  scheduleCache: {},
  reminders: [],
  staff: [],
  staffLoginFormId: null,
  dayOffRequests: [],
};

function isAdmin() { return state.role === 'admin'; }

const DAY_KEYS = ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'];
const DAY_LABELS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
let appEntered = false;

// ---------------------------------------------------------------------------
// Helpers
// ---------------------------------------------------------------------------
function esc(str) {
  return String(str ?? '').replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[c]));
}

function toISODate(d) {
  const tz = new Date(d.getTime() - d.getTimezoneOffset() * 60000);
  return tz.toISOString().slice(0, 10);
}

function startOfWeek(date) {
  const d = new Date(date);
  const day = d.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  d.setDate(d.getDate() + diff);
  d.setHours(0, 0, 0, 0);
  return d;
}

function addDays(date, n) {
  const d = new Date(date);
  d.setDate(d.getDate() + n);
  return d;
}

function fmtShort(date) {
  return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}

function fmtLong(date) {
  return date.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
}

function weekStartForOffset(offset) {
  return addDays(startOfWeek(new Date()), offset * 7);
}

function defaultConfig() {
  return {
    homes: Array.from({ length: 8 }, (_, i) => ({ id: crypto.randomUUID(), name: `Home ${i + 1}` })),
    relievers: Array.from({ length: 11 }, (_, i) => ({ id: crypto.randomUUID(), name: `Reliever ${i + 1}` })),
  };
}

function emptyAssignments() {
  return { homes: {}, relievers: {} };
}

// A reliever/day cell is { name, location }. Older data stored a plain
// name string — normalize that transparently so nothing needs migrating.
function relieverCellData(raw) {
  if (!raw) return { name: '', location: '' };
  if (typeof raw === 'string') return { name: raw, location: '' };
  return { name: raw.name || '', location: raw.location || '' };
}

// ---------------------------------------------------------------------------
// Auth
// ---------------------------------------------------------------------------
function showAuthMessage(msg, isError = false) {
  const el = document.getElementById('authMsg');
  el.textContent = msg;
  el.classList.toggle('error', isError);
}
const showAuthError = (msg) => showAuthMessage(msg, true);

async function handleSignIn(email, password) {
  showAuthMessage('Signing in…');
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if (error) showAuthError(error.message);
}

async function handleSignUp(email, password) {
  showAuthMessage('Creating account…');
  const { error } = await sb.auth.signUp({
    email, password,
    options: { emailRedirectTo: REDIRECT_URL },
  });
  if (error) showAuthError(error.message);
  else showAuthMessage('Check your email to confirm your account.');
}

async function handleForgotPassword(email) {
  if (!email) { showAuthError('Enter your email above first.'); return; }
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: REDIRECT_URL });
  if (error) showAuthError(error.message);
  else showAuthMessage('Password reset email sent.');
}

async function handleSignOut() {
  await sb.auth.signOut();
}

function handleAuthSubmit(form) {
  const fd = new FormData(form);
  const email = fd.get('email').trim();
  const password = fd.get('password');
  if (state.authMode === 'signup') handleSignUp(email, password);
  else handleSignIn(email, password);
}

function renderAuth() {
  document.querySelectorAll('.auth-tab').forEach((b) => b.classList.toggle('active', b.dataset.mode === state.authMode));
  document.querySelector('#authForm button[type=submit]').textContent =
    state.authMode === 'signup' ? 'Create Account' : 'Sign In';
  document.getElementById('authMsg').textContent = '';
  if (SUPABASE_ANON_KEY.startsWith('PASTE_')) {
    document.getElementById('configWarning').style.display = 'block';
  }
}

function showAuthScreen() {
  state.user = null;
  state.role = 'admin';
  state.orgId = null;
  state.staffMemberId = null;
  state.scheduleCache = {};
  state.staff = [];
  state.staffLoginFormId = null;
  state.dayOffRequests = [];
  appEntered = false;
  document.getElementById('authScreen').style.display = 'flex';
  document.getElementById('app').style.display = 'none';
  renderAuth();
}

async function enterApp(user) {
  state.user = user;
  document.getElementById('authScreen').style.display = 'none';
  document.getElementById('app').style.display = '';
  if (!appEntered) {
    appEntered = true;
    await loadRole(user);
    await loadConfig();
    await loadStaff();
    await loadDayOffRequests();
    await loadReminders();
  }
  renderApp();
}

// Data — role / org

async function loadRole(user) {
  let { data, error } = await sb.from('tello_staff_roles').select('*').eq('user_id', user.id).maybeSingle();
  if (error) console.error(error);
  if (!data) {
    const inserted = await sb.from('tello_staff_roles')
      .insert({ user_id: user.id, owner_id: user.id, role: 'admin' })
      .select().single();
    if (inserted.error) console.error(inserted.error);
    data = inserted.data;
  }
  state.role = (data && data.role) || 'admin';
  state.orgId = (data && data.owner_id) || user.id;
  state.staffMemberId = (data && data.staff_member_id) || null;
}

// ---------------------------------------------------------------------------
// Data — config (homes / reliever pool)
// ---------------------------------------------------------------------------
async function loadConfig() {
  const { data, error } = await sb.from('tello_staff_config').select('*').eq('user_id', state.orgId).maybeSingle();
  if (error) { console.error(error); }
  if (data) {
    state.config = {
      homes: (data.homes && data.homes.length) ? data.homes : defaultConfig().homes,
      relievers: (data.relievers && data.relievers.length) ? data.relievers : defaultConfig().relievers,
    };
  } else {
    state.config = defaultConfig();
    await saveConfig();
  }
}

async function saveConfig() {
  if (!isAdmin()) return;
  const { error } = await sb.from('tello_staff_config').upsert({
    user_id: state.orgId,
    homes: state.config.homes,
    relievers: state.config.relievers,
    updated_at: new Date().toISOString(),
  });
  if (error) console.error(error);
}

// ---------------------------------------------------------------------------
// Data — weekly schedule
// ---------------------------------------------------------------------------
async function loadWeek(weekStartStr) {
  if (state.scheduleCache[weekStartStr]) return state.scheduleCache[weekStartStr];
  const { data, error } = await sb.from('tello_staff_schedule').select('*')
    .eq('user_id', state.orgId).eq('week_start', weekStartStr).maybeSingle();
  if (error) console.error(error);
  const assignments = (data && data.assignments) || emptyAssignments();
  state.scheduleCache[weekStartStr] = assignments;
  return assignments;
}

function setCellValue(dataset, value) {
  const ws = weekStartForOffset(state.weekOffset);
  const wsStr = toISODate(ws);
  const assignments = state.scheduleCache[wsStr] || (state.scheduleCache[wsStr] = emptyAssignments());
  if (dataset.kind === 'home') {
    const { home, day, slot } = dataset;
    assignments.homes[home] = assignments.homes[home] || {};
    assignments.homes[home][day] = assignments.homes[home][day] || {};
    assignments.homes[home][day][slot] = value;
  } else if (dataset.kind === 'reliever') {
    const { reliever, day } = dataset;
    assignments.relievers[reliever] = assignments.relievers[reliever] || {};
    const cell = relieverCellData(assignments.relievers[reliever][day]);
    cell.name = value;
    assignments.relievers[reliever][day] = cell;
  } else if (dataset.kind === 'reliever-location') {
    const { reliever, day } = dataset;
    assignments.relievers[reliever] = assignments.relievers[reliever] || {};
    const cell = relieverCellData(assignments.relievers[reliever][day]);
    cell.location = value;
    assignments.relievers[reliever][day] = cell;
  }
  queueSaveWeek(wsStr);
}

let saveScheduleTimer = null;
function queueSaveWeek(weekStartStr) {
  if (!isAdmin()) return;
  clearTimeout(saveScheduleTimer);
  saveScheduleTimer = setTimeout(() => saveWeek(weekStartStr), 500);
}

async function saveWeek(weekStartStr) {
  if (!isAdmin()) return;
  const assignments = state.scheduleCache[weekStartStr] || emptyAssignments();
  const { error } = await sb.from('tello_staff_schedule').upsert({
    user_id: state.orgId,
    week_start: weekStartStr,
    assignments,
    updated_at: new Date().toISOString(),
  }, { onConflict: 'user_id,week_start' });
  if (error) console.error(error);
}

async function loadStaff() {

    .eq('owner_id', state.orgId).order('name');
  if (error) console.error(error);
  state.staff = data || [];
}

async function addStaffMember(name, role, homeId, bdayMonth, bdayDay, contact) {
  if (!isAdmin()) return;
  const { error } = await sb.from('tello_staff_members').insert({
    owner_id: state.orgId, name, role: role || 'caregiver', home_id: homeId || null,
    bday_month: bdayMonth || null, bday_day: bdayDay || null, contact: contact || null,
  });
  if (error) { console.error(error); alert('Could not add staff member: ' + error.message); return; }
  await loadStaff();
  renderStaff();
}

async function updateStaffMember(id, patch) {
  if (!isAdmin()) return;
  const { error } = await sb.from('tello_staff_members').update(patch).eq('id', id);
  if (error) { console.error(error); return; }
  const s = state.staff.find((x) => x.id === id);
  if (s) Object.assign(s, patch);
  if (patch.role && s && s.auth_user_id) {
    const { error: roleErr } = await sb.from('tello_staff_roles').update({ role: patch.role }).eq('user_id', s.auth_user_id);
    if (roleErr) console.error(roleErr);
  }
}

async function deleteStaffMember(id) {
  if (!isAdmin()) return;
  if (!confirm('Remove this staff member from the directory? Their login (if any) is kept but unlinked.')) return;
  const { error } = await sb.from('tello_staff_members').delete().eq('id', id);
  if (error) { console.error(error); return; }
  await loadStaff();
  renderStaff();
}

async function createStaffLogin(staffId, email, password) {
  if (!isAdmin()) return;
  const { data, error } = await sbProvision.auth.signUp({ email, password });
  if (error) { alert('Could not create login: ' + error.message); return; }
  const newUserId = data && data.user && data.user.id;
  if (!newUserId) {
    alert('Account creation did not return a user id — check the Supabase project\'s email confirmation settings.');
    return;
  }
  const staffMember = state.staff.find((s) => s.id === staffId);
  const role = (staffMember && staffMember.role) || 'caregiver';
  const { error: roleErr } = await sb.from('tello_staff_roles')
    .insert({ user_id: newUserId, owner_id: state.orgId, role, staff_member_id: staffId });
  if (roleErr) { console.error(roleErr); alert('Login created, but linking the role failed: ' + roleErr.message); }
  const { error: memberErr } = await sb.from('tello_staff_members')
    .update({ auth_user_id: newUserId, email }).eq('id', staffId);
  if (memberErr) console.error(memberErr);
  state.staffLoginFormId = null;
  await loadStaff();
  renderStaff();
  alert(`Login created for ${email}.\n\nTemporary password: ${password}\n\nShare this with them directly — they can change it later via "Forgot password?" on the sign-in screen.`);
}

async function decideDayOffRequest(id, status) {
  if (!isAdmin()) return;
  const { error } = await sb.from('tello_staff_dayoff_requests')
    .update({ status, decided_by: state.user.id, decided_at: new Date().toISOString() })
    .eq('id', id);
  if (error) { console.error(error); return; }

  renderStaff();

function approvedDayOffSet() {
  const set = new Set();
  state.dayOffRequests.forEach((r) => {
    if (r.status !== 'approved') return;
    const staff = state.staff.find((s) => s.id === r.staff_member_id);
    if (staff) set.add(`${r.date}|${staff.name}`);
  });
  return set;
}

async function renderSchedule() {
  if (!isAdmin()) return renderMySchedule();

  const ws = weekStartForOffset(state.weekOffset);
  const wsStr = toISODate(ws);
  const assignments = await loadWeek(wsStr);
  const days = DAY_KEYS.map((k, i) => ({ key: k, label: DAY_LABELS[i], date: addDays(ws, i) }));
  const todayStr = toISODate(new Date());
  const label = `${fmtShort(ws)} – ${fmtShort(addDays(ws, 6))}, ${addDays(ws, 6).getFullYear()}`;
  const dayOffSet = approvedDayOffSet();

  const dayHeaderCells = days.map((d) => `
    <th class="${toISODate(d.date) === todayStr ? 'is-today' : ''}">
      ${d.label}<br><span class="day-date">${fmtShort(d.date)}</span>
    </th>`).join('');

  const homesRows = state.config.homes.map((home) => renderHomeRows(home, days, assignments, dayOffSet)).join('');
  const relieverRows = state.config.relievers.map((r) => renderRelieverRow(r, days, assignments, dayOffSet)).join('');
  const relieverSection = state.relieverViewMode === 'month'
    ? await renderRelieverMonth(dayOffSet)
    : `<div class="grid-wrap">
        <table class="schedule-grid" id="relieversTable">
          <thead><tr><th class="row-head" colspan="2">Reliever</th>${dayHeaderCells}</tr></thead>
          <tbody>${relieverRows}</tbody>
        </table>
      </div>`;

  const managePanel = state.manageOpen ? `
    <div id="managePanel" class="manage-panel no-print">
      <div class="manage-col">
        <h4>Homes</h4>
        <div class="manage-list">
          ${state.config.homes.map((h) => `
            <div class="manage-row">
              <input type="text" class="manage-name-input" data-kind="home-name" data-id="${h.id}" value="${esc(h.name)}" />
              <button class="btn-remove" data-action="remove-home" data-id="${h.id}">✕</button>
            </div>`).join('')}
        </div>
        <button class="btn-outline" data-action="add-home">+ Add Home</button>
      </div>
      <div class="manage-col">
        <h4>Reliever Pool</h4>
        <div class="manage-list">
          ${state.config.relievers.map((r) => `
            <div class="manage-row">
              <input type="text" class="manage-name-input" data-kind="reliever-name" data-id="${r.id}" value="${esc(r.name)}" />
              <button class="btn-remove" data-action="remove-reliever" data-id="${r.id}">✕</button>
            </div>`).join('')}
        </div>
        <button class="btn-outline" data-action="add-reliever">+ Add Reliever</button>
      </div>
    </div>` : '';

  document.getElementById('view-schedule').innerHTML = `
    <div class="week-bar no-print">
      <button class="btn-icon" data-action="prev-week" title="Previous week">‹</button>
      <div class="week-label">${label}</div>
      <button class="btn-icon" data-action="next-week" title="Next week">›</button>
      <button class="btn-outline" data-action="today-week">Today</button>
      <button class="btn-outline" data-action="manage-toggle">⚙ Manage</button>
      <button class="btn-outline" data-action="print">🖨 Print</button>
    </div>
    ${managePanel}
    <div class="grid-wrap">
      <table class="schedule-grid" id="homesTable">
        <thead><tr><th class="row-head">Home</th><th class="row-head">Shift</th>${dayHeaderCells}</tr></thead>
        <tbody>${homesRows}</tbody>
      </table>
    </div>
    <div class="reliever-toggle">
      <h3 class="section-title" style="margin:0;">Reliever Pool</h3>
      <div class="view-toggle no-print">
        <button data-action="reliever-view" data-mode="week" class="${state.relieverViewMode === 'week' ? 'active' : ''}">Week</button>
        <button data-action="reliever-view" data-mode="month" class="${state.relieverViewMode === 'month' ? 'active' : ''}">Month</button>
      </div>

function cellStateClass(val, flagged) {
  if (!val) return 'cell-empty';
  return flagged ? 'cell-dayoff' : 'cell-filled';
}

function renderHomeRows(home, days, assignments, dayOffSet) {
  const slots = [['cg1', 'Caregiver 1'], ['cg2', 'Caregiver 2'], ['night', 'Night Shift']];
  const homeData = assignments.homes[home.id] || {};
  return slots.map(([slotKey, slotLabel], idx) => `
    <tr>
      ${idx === 0 ? `<th class="row-head" rowspan="3">${esc(home.name)}</th>` : ''}
      <td class="slot-label ${slotKey === 'night' ? 'is-night' : ''}">${slotLabel}</td>
      ${days.map((d) => {
        const dayData = homeData[d.key] || {};
        const val = dayData[slotKey] || '';
        const flagged = val && dayOffSet.has(`${toISODate(d.date)}|${val}`);
        return `<td class="${cellStateClass(val, flagged)}">${staffCell({ kind: 'home', home: home.id, day: d.key, slot: slotKey }, val, flagged)}</td>`;
      }).join('')}
    </tr>`).join('');
}

function renderRelieverRow(reliever, days, assignments, dayOffSet) {
  const relData = assignments.relievers[reliever.id] || {};
  return `
    <tr>
      <th class="row-head" colspan="2">${esc(reliever.name)}</th>
      ${days.map((d) => {
        const cell = relieverCellData(relData[d.key]);
        const dISO = toISODate(d.date);
        const flagged = cell.name && dayOffSet.has(`${dISO}|${cell.name}`);
        const nameSelect = staffCell({ kind: 'reliever', reliever: reliever.id, day: d.key }, cell.name, flagged);
        const locationSelect = locationCell({ kind: 'reliever-location', reliever: reliever.id, day: d.key }, cell.location);
        return `<td class="${cellStateClass(cell.name, flagged)}">${nameSelect}${locationSelect}</td>`;
      }).join('')}
    </tr>`;
}

// Schedule Board cells are dropdowns sourced from the staff directory, with
// a "Custom name…" escape hatch for names not yet in the directory (and a
// synthetic option so any pre-existing free-text value still displays).
// `flagged` marks a cell whose assigned staff member has an approved day
// off on that date, per Day Off Requests.
function staffCell(dataAttrs, val, flagged) {
  const dataStr = Object.entries(dataAttrs).map(([k, v]) => `data-${k}="${esc(v)}"`).join(' ');
  const names = state.staff.map((s) => s.name);
  const knownOrBlank = val === '' || names.includes(val);
  const opts = [`<option value="">—</option>`];
  names.forEach((n) => opts.push(`<option value="${esc(n)}" ${n === val ? 'selected' : ''}>${esc(n)}</option>`));
  if (!knownOrBlank) opts.push(`<option value="${esc(val)}" selected>${esc(val)}</option>`);
  opts.push(`<option value="__custom__">+ Custom name…</option>`);
  const badge = flagged ? `<span class="dayoff-badge" title="Approved day off">🌴</span>` : '';
  return `<select class="cell-input" ${dataStr}>${opts.join('')}</select>${badge}`;
}

// Location dropdown for a reliever/day cell — options are the currently
// configured homes (where a reliever would actually be deployed), plus a
// "Custom…" escape hatch for anything else (an office, a training site).
function locationCell(dataAttrs, val) {
  const dataStr = Object.entries(dataAttrs).map(([k, v]) => `data-${k}="${esc(v)}"`).join(' ');
  const names = state.config.homes.map((h) => h.name);
  const knownOrBlank = val === '' || names.includes(val);
  const opts = [`<option value="">— location —</option>`];
  names.forEach((n) => opts.push(`<option value="${esc(n)}" ${n === val ? 'selected' : ''}>${esc(n)}</option>`));
  if (!knownOrBlank) opts.push(`<option value="${esc(val)}" selected>${esc(val)}</option>`);
  opts.push(`<option value="__custom__">+ Custom…</option>`);
  return `<select class="cell-input cell-location" ${dataStr}>${opts.join('')}</select>`;
}

// ---------------------------------------------------------------------------
// Render — Reliever Pool monthly calendar (Sun–Sat, read-only overview;
// edits still happen in the Week view's live dropdowns)
// ---------------------------------------------------------------------------
function computeMonthGrid(monthOffset) {
  const now = new Date();
  const first = new Date(now.getFullYear(), now.getMonth() + monthOffset, 1);
  const last = new Date(now.getFullYear(), now.getMonth() + monthOffset + 1, 0);
  const gridStart = addDays(first, -first.getDay());
  const gridEnd = addDays(last, 6 - last.getDay());
  const days = [];
  for (let d = new Date(gridStart); d <= gridEnd; d = addDays(d, 1)) days.push(new Date(d));
  return { first, days };
}

async function renderRelieverMonth(dayOffSet) {
  const { first, days } = computeMonthGrid(state.monthOffset);
  const weekStarts = [...new Set(days.map((d) => toISODate(startOfWeek(d))))];
  const weekAssignments = {};
  await Promise.all(weekStarts.map(async (ws) => { weekAssignments[ws] = await loadWeek(ws); }));

  const monthLabel = first.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
  const dayHeaders = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map((d) => `<th>${d}</th>`).join('');

  const cells = days.map((d) => {
    const inMonth = d.getMonth() === first.getMonth();
    const wsStr = toISODate(startOfWeek(d));
    const dayKey = DAY_KEYS[(d.getDay() + 6) % 7];
    const assignments = weekAssignments[wsStr] || emptyAssignments();
    const dISO = toISODate(d);
    const working = [];
    state.config.relievers.forEach((r) => {
      const cell = relieverCellData((assignments.relievers[r.id] || {})[dayKey]);
      if (cell.name) working.push(cell);
    });
    const onDayOff = working.filter((c) => dayOffSet.has(`${dISO}|${c.name}`));
    const active = working.filter((c) => !dayOffSet.has(`${dISO}|${c.name}`));
    const cellClass = !inMonth ? 'month-cell outside' : (working.length ? 'month-cell' : 'month-cell empty');
    return `
      <td class="${cellClass}">
        <div class="month-daynum">${d.getDate()}</div>
        ${active.map((c) => `<div class="month-entry filled">${esc(c.name)}${c.location ? ` <span class="month-loc">— ${esc(c.location)}</span>` : ''}</div>`).join('')}
        ${onDayOff.map((c) => `<div class="month-entry dayoff">🌴 ${esc(c.name)}</div>`).join('')}
        ${(!working.length && inMonth) ? `<div class="month-entry no-relievers">No relievers</div>` : ''}
      </td>`;
  });

  const rows = [];
  for (let i = 0; i < cells.length; i += 7) rows.push(`<tr>${cells.slice(i, i + 7).join('')}</tr>`);

  return `
    <div class="week-bar no-print">
      <button class="btn-icon" data-action="prev-month" title="Previous month">‹</button>
      <div class="week-label">${monthLabel}</div>
      <button class="btn-icon" data-action="next-month" title="Next month">›</button>
      <button class="btn-outline" data-action="today-month">This Month</button>
    </div>
    <div class="grid-wrap">
      <table class="schedule-grid month-grid">
        <thead><tr>${dayHeaders}</tr></thead>
        <tbody>${rows.join('')}</tbody>
      </table>
    </div>`;
}

async function renderMySchedule() {
  const me = state.staff.find((s) => s.id === state.staffMemberId);
  if (!me) {
    document.getElementById('view-schedule').innerHTML = `
      <div class="placeholder-view" style="display:flex; min-height:40vh;">
        <div class="placeholder">
          <div class="placeholder-icon">🗓️</div>
          <h2>My Schedule</h2>
          <p>Your staff profile isn't linked to your login yet — ask your admin to finish setting it up in the Staff tab.</p>
        </div>
      </div>`;
    return;
  }

  const ws = weekStartForOffset(state.weekOffset);
  const wsStr = toISODate(ws);
  const assignments = await loadWeek(wsStr);
  const days = DAY_KEYS.map((k, i) => ({ key: k, label: DAY_LABELS[i], date: addDays(ws, i) }));
  const label = `${fmtShort(ws)} – ${fmtShort(addDays(ws, 6))}, ${addDays(ws, 6).getFullYear()}`;
  const dayOffSet = approvedDayOffSet();

  const rows = days.map((d) => {
    const dISO = toISODate(d.date);
    const shifts = [];
    state.config.homes.forEach((home) => {
      const dayData = (assignments.homes[home.id] || {})[d.key] || {};
      [['cg1', 'Caregiver 1'], ['cg2', 'Caregiver 2'], ['night', 'Night Shift']].forEach(([slotKey, slotLabel]) => {
        if (dayData[slotKey] === me.name) shifts.push(`${esc(home.name)} — ${slotLabel}`);
      });
    });
    state.config.relievers.forEach((r) => {
      const cell = relieverCellData((assignments.relievers[r.id] || {})[d.key]);
      if (cell.name === me.name) shifts.push(`Reliever — ${esc(r.name)}${cell.location ? ` (${esc(cell.location)})` : ''}`);
    });
    const isDayOff = dayOffSet.has(`${dISO}|${me.name}`);
    return `
      <div class="shift-row">
        <div class="shift-home">${d.label} <span class="day-date">${fmtShort(d.date)}</span></div>
        <div class="shift-slots">
          ${isDayOff ? `<span class="unfilled" style="color:var(--danger);">🌴 Approved day off</span>` : ''}
          ${shifts.length ? shifts.map((s) => `<span class="filled">${s}</span>`).join('') : (isDayOff ? '' : `<span class="muted">Not scheduled</span>`)}
        </div>
      </div>`;
  }).join('');

  document.getElementById('view-schedule').innerHTML = `
    <div class="week-bar no-print">
      <button class="btn-icon" data-action="prev-week" title="Previous week">‹</button>
      <div class="week-label">${label}</div>
      <button class="btn-icon" data-action="next-week" title="Next week">›</button>
      <button class="btn-outline" data-action="today-week">Today</button>
    </div>
    <section class="card">
      <h3>My Schedule — ${esc(me.name)}</h3>
      ${rows}
    </section>`;
}

// ---------------------------------------------------------------------------
// Render — Staff directory
// ---------------------------------------------------------------------------
function renderStaff() {
  const homeOptions = state.config.homes.map((h) => `<option value="${h.id}">${esc(h.name)}</option>`).join('');

  document.getElementById('view-staff').innerHTML = `
    <h3 class="section-title" style="margin-top:0;">Add Staff Member</h3>
    <div class="manage-panel no-print">
      <div class="manage-col" style="flex:1 1 100%;">
        <form data-form="add-staff" class="inline-form">
          <input type="text" name="name" placeholder="Full name" required />
          <select name="role">
            <option value="caregiver">Caregiver</option>
            <option value="admin">Admin</option>
          </select>
          <select name="home_id">
            <option value="">Unassigned</option>
            ${homeOptions}
          </select>
          <input type="text" name="contact" placeholder="Contact (phone)" />
          <input type="date" name="birthday" title="Birthday (optional)" />
          <button type="submit" class="btn-primary">+ Add Staff</button>
        </form>
      </div>
    </div>

    <h3 class="section-title">Staff (${state.staff.length})</h3>
    <div class="list">
      ${state.staff.length ? state.staff.map(renderStaffRow).join('') : `<div class="muted">No staff added yet.</div>`}
    </div>

    ${renderDayOffAdminSection()}
  `;
}

function renderDayOffAdminSection() {
  const rows = state.dayOffRequests.slice().sort((a, b) => {
    if ((a.status === 'pending') !== (b.status === 'pending')) return a.status === 'pending' ? -1 : 1;
    return a.date < b.date ? -1 : a.date > b.date ? 1 : 0;
  });
  return `
    <h3 class="section-title">Day Off Requests</h3>
    <div class="list">
      ${rows.length ? rows.map(renderDayOffRow).join('') : `<div class="muted">No requests yet.</div>`}
    </div>`;
}

function dayOffBadge(status) {
  const color = status === 'approved' ? 'var(--positive)' : status === 'denied' ? 'var(--danger)' : 'var(--accent)';
  return `<span style="color:${color}; font-weight:700; font-size:12px; text-transform:capitalize;">${status}</span>`;
}

function renderDayOffRow(r) {
  const staff = state.staff.find((s) => s.id === r.staff_member_id);
  return `
    <div class="reminder-item">
      <div class="reminder-body">
        <div class="reminder-title">${esc(staff ? staff.name : 'Unknown staff')} — ${esc(r.date)}</div>
        ${r.reason ? `<div class="reminder-note">${esc(r.reason)}</div>` : ''}
      </div>
      ${dayOffBadge(r.status)}
      ${r.status === 'pending' ? `
        <button class="btn-outline small" data-action="dayoff-approve" data-id="${r.id}">Approve</button>
        <button class="btn-outline small" data-action="dayoff-deny" data-id="${r.id}">Deny</button>` : ''}
    </div>`;
}

// ---------------------------------------------------------------------------
// Render — Day Off (caregiver)
// ---------------------------------------------------------------------------
function renderDayOff() {
  document.getElementById('view-dayoff').innerHTML = `
    <h3 class="section-title" style="margin-top:0;">Request a Day Off</h3>
    <div class="card">
      <form data-form="dayoff-request" class="inline-form">
        <input type="date" name="date" required />
        <input type="text" name="reason" placeholder="Reason (optional)" />
        <button type="submit" class="btn-primary">Submit Request</button>
      </form>
    </div>

    <h3 class="section-title">My Requests</h3>
    <div class="list">
      ${state.dayOffRequests.length ? state.dayOffRequests.map(renderMyDayOffRow).join('') : `<div class="muted">No requests yet.</div>`}
    </div>
  `;
}

function renderMyDayOffRow(r) {
  return `
    <div class="reminder-item">
      <div class="reminder-body">
        <div class="reminder-title">${esc(r.date)}</div>
        ${r.reason ? `<div class="reminder-note">${esc(r.reason)}</div>` : ''}
      </div>
      ${dayOffBadge(r.status)}
      ${r.status === 'pending' ? `<button class="btn-remove" data-action="dayoff-cancel" data-id="${r.id}">✕</button>` : ''}
    </div>`;
}

function renderStaffRow(s) {
  const homeOptions = state.config.homes.map((h) =>
    `<option value="${h.id}" ${s.home_id === h.id ? 'selected' : ''}>${esc(h.name)}</option>`).join('');
  const bdayVal = (s.bday_month && s.bday_day)
    ? `2000-${String(s.bday_month).padStart(2, '0')}-${String(s.bday_day).padStart(2, '0')}` : '';
  return `
    <div class="card" style="padding:12px 14px; margin-bottom:10px;">
      <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
        <input type="text" class="manage-name-input" style="flex:2; min-width:140px;" data-kind="staff-name" data-id="${s.id}" value="${esc(s.name)}" />
        <select data-kind="staff-role" data-id="${s.id}">
          <option value="caregiver" ${s.role === 'caregiver' ? 'selected' : ''}>Caregiver</option>
          <option value="admin" ${s.role === 'admin' ? 'selected' : ''}>Admin</option>
        </select>
        <select data-kind="staff-home" data-id="${s.id}">
          <option value="">Unassigned</option>
          ${homeOptions}
        </select>
        <input type="text" placeholder="Contact (phone)" style="flex:1; min-width:120px;" data-kind="staff-contact" data-id="${s.id}" value="${esc(s.contact || '')}" />
        <input type="date" title="Birthday" data-kind="staff-birthday" data-id="${s.id}" value="${bdayVal}" />
        <button class="btn-remove" data-action="staff-delete" data-id="${s.id}" title="Remove">✕</button>
      </div>
      <div style="margin-top:8px;">
        ${renderStaffLoginArea(s)}
      </div>
    </div>`;
}

function renderStaffLoginArea(s) {
  if (s.auth_user_id) {
    return `<span class="muted">🔑 Login active${s.email ? `: ${esc(s.email)}` : ''}</span>`;
  }
  if (state.staffLoginFormId === s.id) {
    return `
      <form data-form="staff-login" data-id="${s.id}" class="inline-form">
        <input type="email" name="email" placeholder="Login email" required />
        <input type="text" name="password" placeholder="Temporary password (6+ chars)" minlength="6" required />
        <button type="submit" class="btn-primary">Create Login</button>
        <button type="button" class="btn-outline" data-action="staff-login-cancel">Cancel</button>
      </form>`;
  }
  return `<button class="btn-outline small" data-action="staff-create-login" data-id="${s.id}">+ Create Login</button>`;
}

// ---------------------------------------------------------------------------
// Render — Today board
// ---------------------------------------------------------------------------
async function renderToday() {
  const now = new Date();
  const todayWs = toISODate(startOfWeek(now));
  const assignments = await loadWeek(todayWs);
  const dayKey = DAY_KEYS[(now.getDay() + 6) % 7];

  const cell = (v, isNight) => v
    ? `<span class="filled ${isNight ? 'night' : ''}">${esc(v)}</span>`
    : `<span class="unfilled">unfilled</span>`;

  const shiftRows = state.config.homes.map((home) => {
    const d = (assignments.homes[home.id] || {})[dayKey] || {};
    return `
      <div class="shift-row">
        <div class="shift-home">${esc(home.name)}</div>
        <div class="shift-slots">
          <div>CG1: ${cell(d.cg1)}</div>
          <div>CG2: ${cell(d.cg2)}</div>
          <div>Night: ${cell(d.night, true)}</div>
        </div>
      </div>`;
  }).join('');

  const relieverToday = state.config.relievers
    .map((r) => ({ r, cell: relieverCellData((assignments.relievers[r.id] || {})[dayKey]) }))
    .filter((x) => x.cell.name)
    .map((x) => `<div class="reliever-today-row"><b>${esc(x.r.name)}</b>: ${esc(x.cell.name)}${x.cell.location ? ` — ${esc(x.cell.location)}` : ''}</div>`)
    .join('') || `<div class="muted">No relievers deployed today.</div>`;

  document.getElementById('view-today').innerHTML = `
    <div class="today-date">${fmtLong(now)}</div>

    <section class="card">
      <h3>Shift Summary</h3>
      ${shiftRows}
      <h4 class="sub">Relievers Deployed Today</h4>
      ${relieverToday}
    </section>

    <section class="card">
      <h3>Reminders</h3>
      ${isAdmin() ? `
      <form data-form="reminder" class="inline-form">
        <input type="text" name="title" placeholder="Reminder title" required />
        <input type="text" name="note" placeholder="Note (optional)" />
        <input type="time" name="due_time" />
        <button type="submit" class="btn-primary">+ Add</button>
      </form>` : ''}
      <div class="list">${renderReminders()}</div>
    </section>

    <section class="card">
      <h3>Birthdays</h3>
      ${isAdmin() ? `<p style="font-size:12px; margin-top:-4px;">Set a staff member's birthday from the Staff tab.</p>` : ''}
      <div class="list">${renderBirthdays(now)}</div>
    </section>
  `;
}

function renderReminders() {
  if (!state.reminders.length) return `<div class="muted">No reminders yet.</div>`;
  return state.reminders.map((r) => `
    <div class="reminder-item ${r.done ? 'done' : ''}">
      <input type="checkbox" data-kind="reminder-done" data-id="${r.id}" ${r.done ? 'checked' : ''} ${isAdmin() ? '' : 'disabled'} />
      <div class="reminder-body">
        <div class="reminder-title">${esc(r.title)}${r.due_time ? ` <span class="due-time">${esc(r.due_time)}</span>` : ''}</div>
        ${r.note ? `<div class="reminder-note">${esc(r.note)}</div>` : ''}
      </div>
      ${isAdmin() ? `<button class="btn-remove" data-action="reminder-delete" data-id="${r.id}">✕</button>` : ''}
    </div>`).join('');
}

function nextBirthdayDiff(month, day, now) {
  const year = now.getFullYear();
  const today0 = new Date(now); today0.setHours(0, 0, 0, 0);
  let next = new Date(year, month - 1, day);
  if (next < today0) next = new Date(year + 1, month - 1, day);
  return Math.round((next - today0) / 86400000);
}

function renderBirthdays(now) {
  const withBday = state.staff.filter((s) => s.bday_month && s.bday_day);
  if (!withBday.length) return `<div class="muted">No staff birthdays set yet.</div>`;
  const withDiff = withBday
    .map((s) => ({ s, diff: nextBirthdayDiff(s.bday_month, s.bday_day, now) }))
    .sort((a, b) => a.diff - b.diff);
  return withDiff.map(({ s, diff }) => {
    const label = diff === 0 ? 'Today!' : diff === 1 ? 'Tomorrow' : `in ${diff} days`;
    const monthName = new Date(2000, s.bday_month - 1, 1).toLocaleDateString('en-US', { month: 'short' });
    return `
      <div class="birthday-item ${diff === 0 ? 'today' : ''}">
        <div><b>${esc(s.name)}</b> — ${monthName} ${s.bday_day}</div>
        <div class="birthday-tag">${label}</div>
      </div>`;
  }).join('');
}

// ---------------------------------------------------------------------------
// Event delegation
// ---------------------------------------------------------------------------
function onGlobalClick(e) {
  const btn = e.target.closest('[data-action]');
  if (!btn) return;
  const action = btn.dataset.action;
  switch (action) {
    case 'nav-tab':
      state.tab = btn.dataset.tab;
      renderApp();
      break;
    case 'sign-out':
      handleSignOut();
      break;
    case 'prev-week':
      state.weekOffset -= 1;
      renderSchedule();
      break;
    case 'next-week':
      state.weekOffset += 1;
      renderSchedule();
      break;
    case 'today-week':
      state.weekOffset = 0;
      renderSchedule();
      break;
    case 'reliever-view':
      state.relieverViewMode = btn.dataset.mode;
      renderSchedule();
      break;
    case 'prev-month':
      state.monthOffset -= 1;
      renderSchedule();
      break;
    case 'next-month':
      state.monthOffset += 1;
      renderSchedule();
      break;
    case 'today-month':
      state.monthOffset = 0;
      renderSchedule();
      break;
    case 'manage-toggle':
      state.manageOpen = !state.manageOpen;
      renderSchedule();
      break;
    case 'print':
      window.print();
      break;
    case 'add-home':
      state.config.homes.push({ id: crypto.randomUUID(), name: `Home ${state.config.homes.length + 1}` });
      saveConfig();
      renderSchedule();
      break;
    case 'remove-home':
      state.config.homes = state.config.homes.filter((h) => h.id !== btn.dataset.id);
      saveConfig();
      renderSchedule();
      break;
    case 'add-reliever':
      state.config.relievers.push({ id: crypto.randomUUID(), name: `Reliever ${state.config.relievers.length + 1}` });
      saveConfig();
      renderSchedule();
      break;
    case 'remove-reliever':
      state.config.relievers = state.config.relievers.filter((r) => r.id !== btn.dataset.id);
      saveConfig();
      renderSchedule();
      break;
    case 'reminder-delete':
      deleteReminder(btn.dataset.id);
      break;
    case 'staff-delete':
      deleteStaffMember(btn.dataset.id);
      break;
    case 'staff-create-login':
      state.staffLoginFormId = btn.dataset.id;
      renderStaff();
      break;
    case 'staff-login-cancel':
      state.staffLoginFormId = null;
      renderStaff();
      break;
    case 'dayoff-approve':
      decideDayOffRequest(btn.dataset.id, 'approved');
      break;
    case 'dayoff-deny':
      decideDayOffRequest(btn.dataset.id, 'denied');
      break;
    case 'dayoff-cancel':
      cancelDayOffRequest(btn.dataset.id);
      break;
    case 'auth-tab':
      state.authMode = btn.dataset.mode;
      renderAuth();
      break;
    case 'forgot-password':
      handleForgotPassword(document.getElementById('authEmail').value.trim());
      break;
  }
}

function onGlobalSubmit(e) {
  const form = e.target;
  if (form.dataset.form === 'reminder') {
    e.preventDefault();
    const fd = new FormData(form);
    const title = fd.get('title').trim();
    if (!title) return;
    addReminder(title, fd.get('note').trim(), fd.get('due_time'));
    form.reset();
  } else if (form.dataset.form === 'add-staff') {
    e.preventDefault();
    const fd = new FormData(form);
    const name = fd.get('name').trim();
    if (!name) return;
    const bday = fd.get('birthday');
    const [, bm, bd] = bday ? bday.split('-').map(Number) : [];
    addStaffMember(name, fd.get('role'), fd.get('home_id') || null, bm, bd, fd.get('contact').trim());
    form.reset();
  } else if (form.dataset.form === 'staff-login') {
    e.preventDefault();
    const fd = new FormData(form);
    const email = fd.get('email').trim();
    const password = fd.get('password');
    if (!email || !password) return;
    createStaffLogin(form.dataset.id, email, password);
  } else if (form.dataset.form === 'dayoff-request') {
    e.preventDefault();
    const fd = new FormData(form);
    const date = fd.get('date');
    if (!date) return;
    submitDayOffRequest(date, fd.get('reason').trim());
    form.reset();
  } else if (form.id === 'authForm') {
    e.preventDefault();
    handleAuthSubmit(form);
  }
}

function onGlobalChange(e) {
  const t = e.target;
  if (t.classList.contains('cell-input')) {
    if (t.value === '__custom__') {
      const label = t.dataset.kind === 'reliever-location' ? 'Location:' : 'Staff name:';
      const val = window.prompt(label, '');
      if (val && val.trim()) setCellValue(t.dataset, val.trim());
      renderSchedule();
      return;
    }
    setCellValue(t.dataset, t.value);
    return;
  }
  if (t.dataset.kind === 'reminder-done') {
    toggleReminder(t.dataset.id, t.checked);
  } else if (t.dataset.kind === 'home-name') {
    const home = state.config.homes.find((h) => h.id === t.dataset.id);
    if (home) { home.name = t.value; saveConfig(); renderSchedule(); }
  } else if (t.dataset.kind === 'reliever-name') {
    const rel = state.config.relievers.find((r) => r.id === t.dataset.id);
    if (rel) { rel.name = t.value; saveConfig(); renderSchedule(); }
  } else if (t.dataset.kind === 'staff-name') {
    updateStaffMember(t.dataset.id, { name: t.value });
  } else if (t.dataset.kind === 'staff-role') {
    updateStaffMember(t.dataset.id, { role: t.value }).then(renderStaff);
  } else if (t.dataset.kind === 'staff-home') {
    updateStaffMember(t.dataset.id, { home_id: t.value || null });
  } else if (t.dataset.kind === 'staff-contact') {
    updateStaffMember(t.dataset.id, { contact: t.value.trim() || null });
  } else if (t.dataset.kind === 'staff-birthday') {
    if (t.value) {
      const [, m, d] = t.value.split('-').map(Number);
      updateStaffMember(t.dataset.id, { bday_month: m, bday_day: d });
    } else {
      updateStaffMember(t.dataset.id, { bday_month: null, bday_day: null });
    }
  }
}

// ---------------------------------------------------------------------------
// Init
// ---------------------------------------------------------------------------
function init() {
  document.addEventListener('click', onGlobalClick);
  document.addEventListener('submit', onGlobalSubmit);
  document.addEventListener('change', onGlobalChange);

  sb.auth.onAuthStateChange((_event, session) => {
    if (session && session.user) enterApp(session.user);
    else showAuthScreen();
  });
}

init();
</script>
